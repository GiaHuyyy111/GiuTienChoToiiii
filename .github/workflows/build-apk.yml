name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create signing key
        shell: bash
        run: |
          set -e
          mkdir -p .signing
          PASS="$(openssl rand -hex 24)"
          printf '%s' "$PASS" > .signing/password.txt
          keytool -genkeypair -v             -keystore .signing/release.jks             -storepass "$PASS"             -keypass "$PASS"             -alias giutien             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=GiuTienChoToiiii,O=Personal,C=VN"
          cat > keystore.properties <<EOF
          storeFile=.signing/release.jks
          storePassword=$PASS
          keyAlias=giutien
          keyPassword=$PASS
          EOF

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GiuTienChoToiiii-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload signing key backup
        uses: actions/upload-artifact@v4
        with:
          name: GiuTienChoToiiii-Signing-Key
          path: |
            .signing/release.jks
            .signing/password.txt
          retention-days: 90
