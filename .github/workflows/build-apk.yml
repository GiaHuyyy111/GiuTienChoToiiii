name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --stacktrace
      - name: Package unsigned APK and signer
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar out/
      - uses: actions/upload-artifact@v4
        with:
          name: GiuTienChoToiiii-build
          path: out/
          retention-days: 7
