<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giữ tiền cho toiiii</title>
<style>
:root{--bg:#eef0f2;--green:#25ae46;--red:#e43448;--blue:#1385f4;--dark:#181818}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#222;padding-bottom:24px}
button,input,select{font:inherit}.top{position:sticky;top:0;z-index:5;background:#151515;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:800}
.avatar{width:48px;height:48px;border-radius:12px;background:#72594d;display:grid;place-items:center}
.wrap{max-width:470px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #00000010}
h1{text-align:center;font-size:38px;margin:5px 0 8px}.account{text-align:center;color:#666;margin-bottom:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.btn{border:0;border-radius:10px;padding:14px 8px;color:#fff;font-weight:800}.cyan{background:#1ea6bb}.dark{background:#303034}
.sum{border-radius:16px;padding:20px;text-align:center;color:#fff;margin:12px 0}.sum b{display:block;font-size:18px}.sum strong{display:block;font-size:26px;margin-top:5px}.green{background:var(--green)}.red{background:var(--red)}.blue{background:var(--blue)}
.legend{display:flex;justify-content:center;gap:18px;color:#666;margin:15px 0}.dot{display:inline-block;width:38px;height:14px;border-radius:3px;margin-right:7px;vertical-align:middle}
.piewrap{display:grid;place-items:center}.pie{width:min(75vw,300px);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--green) 0 50%,var(--red) 50% 100%);position:relative;display:grid;place-items:center}.pie:after{content:"";position:absolute;inset:31%;border-radius:50%;background:#fff}.pietxt{z-index:2;background:#222e;color:#fff;padding:7px 9px;border-radius:8px;font-size:13px;text-align:center}
.form input,.form select{width:100%;height:58px;border:1.5px solid #cfd2d6;border-radius:10px;margin-bottom:11px;padding:0 14px;font-size:17px;background:#fff}.save{width:100%;height:58px;border:0;border-radius:10px;background:#303034;color:#fff;font-size:18px;font-weight:900}
.edit{display:none;background:#fff4cc;color:#6d5600;padding:10px;border-radius:9px;margin-bottom:10px}.edit.show{display:flex;justify-content:space-between}.edit button{border:0;background:none;font-weight:900}
.filters{display:flex;gap:10px;overflow:auto;margin-bottom:12px}.filter{min-width:135px;border:0;border-radius:999px;padding:14px;background:#e1e4e8;font-weight:800}.filter.active{background:var(--blue);color:#fff}
.list{padding:0;overflow:hidden}.head,.row{display:grid;grid-template-columns:70px 1fr 88px 42px;gap:7px;align-items:center;padding:13px 10px}.head{background:#f4f5f6;border-bottom:1px solid #ddd;font-size:13px;font-weight:800}.row{min-height:78px;border-bottom:1px solid #ddd}.date{font-size:12px}.desc{font-size:15px;word-break:break-word}.note{font-size:12px;color:#777;margin-top:4px}.amt{text-align:right;font-weight:900;font-size:14px}.amt.in{color:var(--green)}.amt.out{color:#d83d50}.del{width:38px;height:38px;border:0;border-radius:8px;background:#ff5258;color:#fff;font-weight:900}.empty{text-align:center;color:#777;padding:24px}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foot button{border:0;border-radius:10px;padding:14px 8px;font-weight:800}.backup{background:#dfe8ff;color:#125fca}.danger{background:#ffe1e4;color:#b42237}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.sheet{width:min(100%,470px);max-height:80vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.log{padding:10px 0;border-bottom:1px solid #eee}.time{font-size:12px;color:#888}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 13px;border-radius:9px;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="top"><span>Giữ tiền cho toiiii</span><span class="avatar">😼</span></div>
<main class="wrap">
<section class="card">
<h1>Thu chi vô tri</h1>
<div class="account">Tài khoản: huychau110@gmail.com</div>
<div class="actions"><button id="historyBtn" class="btn cyan">Lịch sử thao tác</button><button id="backupBtn" class="btn dark">Sao lưu dữ liệu</button></div>
<div class="sum green"><b>Tổng Thu:</b><strong id="income">0 đ</strong></div>
<div class="sum red"><b>Tổng Chi:</b><strong id="expense">0 đ</strong></div>
<div class="sum blue"><b>Số Dư:</b><strong id="balance">0 đ</strong></div>
<div class="legend"><span><i class="dot" style="background:#25ae46"></i>Tổng Thu</span><span><i class="dot" style="background:#e43448"></i>Tổng Chi</span></div>
<div class="piewrap"><div id="pie" class="pie"><div id="pietxt" class="pietxt">Chưa có dữ liệu</div></div></div>
</section>

<section class="card form">
<div id="editbar" class="edit">Đang sửa giao dịch <button id="cancelEdit">Hủy</button></div>
<input id="date" type="date">
<input id="desc" placeholder="Mô tả (Ăn sáng, Lương...)">
<input id="amount" inputmode="numeric" placeholder="Số tiền (VNĐ)">
<select id="type"><option value="Chi">Khoản Chi</option><option value="Thu">Khoản Thu</option></select>
<input id="note" placeholder="Ghi chú thêm...">
<button id="saveBtn" class="save">Thêm Giao Dịch</button>
</section>

<div class="filters">
<button class="filter active" data-f="all">Tất cả</button>
<button class="filter" data-f="Thu">Chỉ xem Thu</button>
<button class="filter" data-f="Chi">Chỉ xem Chi</button>
</div>

<section class="card list">
<div class="head"><span>Ngày</span><span>Mô tả</span><span style="text-align:right">Số tiền</span><span>Xóa</span></div>
<div id="list"></div>
</section>

<div class="foot">
<button id="restoreBtn" class="backup">Khôi phục JSON</button>
<button id="clearBtn" class="danger">Xóa tất cả</button>
<input id="restoreFile" type="file" accept="application/json,.json" hidden>
</div>
</main>

<div id="modal" class="modal"><div class="sheet"><h2>Lịch sử thao tác</h2><div id="history"></div><button id="closeModal" class="btn dark" style="width:100%;margin-top:12px">Đóng</button></div></div>
<div id="toast" class="toast"></div>

<script>
const $=id=>document.getElementById(id),K='giu_tien_transactions_v1',LK='giu_tien_logs_v1';
let tx=load(K,[]),logs=load(LK,[]),filter='all',editing=null;
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}
function save(){localStorage.setItem(K,JSON.stringify(tx));localStorage.setItem(LK,JSON.stringify(logs))}
function today(){let d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,10)}
function money(n){return new Intl.NumberFormat('vi-VN').format(Number(n||0))+' đ'}
function num(v){return Number(String(v||'').replace(/\D/g,''))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateVN(v){let p=String(v).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}
function toast(s){let e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700)}
function addLog(s){logs.unshift({time:new Date().toLocaleString('vi-VN'),text:s});logs=logs.slice(0,150)}
function totals(){return tx.reduce((a,t)=>{t.type==='Thu'?a.i+=+t.amount:a.e+=+t.amount;return a},{i:0,e:0})}
function renderSummary(){let t=totals(),all=t.i+t.e,p=all?t.i/all*100:50;$('income').textContent=money(t.i);$('expense').textContent=money(t.e);$('balance').textContent=money(t.i-t.e);$('pie').style.background=`conic-gradient(#25ae46 0 ${p}%,#e43448 ${p}% 100%)`;$('pietxt').innerHTML=all?`Thu ${Math.round(p)}%<br><b>${money(t.i-t.e)}</b>`:'Chưa có dữ liệu'}
function renderList(){let a=[...tx].sort((x,y)=>(y.created||y.id)-(x.created||x.id));if(filter!=='all')a=a.filter(x=>x.type===filter);$('list').innerHTML=a.length?a.map(t=>`<div class="row" data-id="${t.id}"><div class="date">${dateVN(t.date)}</div><div class="desc">${esc(t.desc)}${t.note?`<div class="note">${esc(t.note)}</div>`:''}</div><div class="amt ${t.type==='Thu'?'in':'out'}">${t.type==='Thu'?'+':'-'}${new Intl.NumberFormat('vi-VN').format(t.amount)}</div><button class="del" data-del="${t.id}">X</button></div>`).join(''):'<div class="empty">Chưa có giao dịch nào.</div>'}
function renderHistory(){$('history').innerHTML=logs.length?logs.map(x=>`<div class="log"><div class="time">${esc(x.time)}</div>${esc(x.text)}</div>`).join(''):'<div class="empty">Chưa có lịch sử.</div>'}
function render(){renderSummary();renderList();renderHistory()}
function reset(){editing=null;$('date').value=today();$('desc').value='';$('amount').value='';$('type').value='Chi';$('note').value='';$('saveBtn').textContent='Thêm Giao Dịch';$('editbar').classList.remove('show')}
function edit(id){let t=tx.find(x=>String(x.id)===String(id));if(!t)return;editing=t.id;$('date').value=t.date;$('desc').value=t.desc;$('amount').value=new Intl.NumberFormat('vi-VN').format(t.amount);$('type').value=t.type;$('note').value=t.note||'';$('saveBtn').textContent='Cập Nhật Giao Dịch';$('editbar').classList.add('show');document.querySelector('.form').scrollIntoView({behavior:'smooth'})}
$('amount').addEventListener('input',e=>{let n=num(e.target.value);e.target.value=n?new Intl.NumberFormat('vi-VN').format(n):''});
$('saveBtn').onclick=()=>{let date=$('date').value,desc=$('desc').value.trim(),amount=num($('amount').value),type=$('type').value,note=$('note').value.trim();if(!date)return toast('Chọn ngày');if(!desc)return toast('Nhập mô tả');if(!amount)return toast('Nhập số tiền hợp lệ');if(editing!==null){let t=tx.find(x=>String(x.id)===String(editing));Object.assign(t,{date,desc,amount,type,note,updated:Date.now()});addLog('Cập nhật: '+desc+' • '+(type==='Thu'?'+':'-')+money(amount));toast('Đã cập nhật')}else{tx.push({id:Date.now()+Math.floor(Math.random()*999),date,desc,amount,type,note,created:Date.now()});addLog('Thêm: '+desc+' • '+(type==='Thu'?'+':'-')+money(amount));toast('Đã thêm giao dịch')}save();reset();render()};
$('list').onclick=e=>{let b=e.target.closest('[data-del]');if(b){e.stopPropagation();let t=tx.find(x=>String(x.id)===b.dataset.del);if(t&&confirm('Xóa giao dịch “'+t.desc+'”?')){tx=tx.filter(x=>String(x.id)!==b.dataset.del);addLog('Xóa: '+t.desc);save();render();toast('Đã xóa')}return}let r=e.target.closest('.row');if(r)edit(r.dataset.id)};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;renderList()});
$('cancelEdit').onclick=reset;$('historyBtn').onclick=()=>{$('modal').classList.add('show');renderHistory()};$('closeModal').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
$('clearBtn').onclick=()=>{if(tx.length&&confirm('Xóa toàn bộ giao dịch?')){tx=[];addLog('Đã xóa toàn bộ giao dịch');save();reset();render();toast('Đã xóa dữ liệu')}};
$('backupBtn').onclick=()=>{let data=JSON.stringify({version:1,exportedAt:new Date().toISOString(),transactions:tx,logs},null,2),name='giu-tien-backup-'+today()+'.json';if(window.Android&&Android.saveBackup){Android.saveBackup(data,name);toast('Chọn nơi lưu bản sao')}else{let u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}};
$('restoreBtn').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.transactions))throw 0;if(confirm('Khôi phục '+d.transactions.length+' giao dịch?')){tx=d.transactions;logs=Array.isArray(d.logs)?d.logs:[];addLog('Khôi phục '+tx.length+' giao dịch');save();reset();render();toast('Đã khôi phục dữ liệu')}}catch{alert('File sao lưu không hợp lệ')}e.target.value=''};
reset();render();
</script>
</body>
</html>
