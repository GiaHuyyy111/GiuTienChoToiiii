<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Giữ tiền cho toiiii</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0f2;font-family:Arial,sans-serif;color:#222;padding-bottom:24px}.top{position:sticky;top:0;z-index:5;background:#151515;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-size:23px;font-weight:800}.av{width:46px;height:46px;border-radius:12px;background:#705649;display:grid;place-items:center}.w{max-width:470px;margin:auto;padding:12px}.c{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #0001}h1{text-align:center;font-size:34px;margin:4px 0 8px}.ac{text-align:center;color:#666;margin-bottom:16px}.acts,.foot{display:grid;grid-template-columns:1fr 1fr;gap:10px}.b{border:0;border-radius:10px;padding:14px 8px;color:#fff;font-weight:800}.cy{background:#1ea6bb}.dk{background:#303034}.sum{border-radius:16px;padding:19px;text-align:center;color:#fff;margin:11px 0}.sum b,.sum strong{display:block}.sum strong{font-size:25px;margin-top:5px}.gr{background:#25ae46}.rd{background:#e43448}.bl{background:#1385f4}.legend{display:flex;justify-content:center;gap:18px;color:#666;margin:15px 0}.dot{display:inline-block;width:34px;height:13px;border-radius:3px;margin-right:6px;vertical-align:middle}.pw{display:grid;place-items:center}.pie{width:min(73vw,290px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;background:conic-gradient(#25ae46 0 50%,#e43448 50% 100%)}.pie:after{content:"";position:absolute;inset:31%;background:#fff;border-radius:50%}.pt{z-index:2;background:#222e;color:#fff;border-radius:8px;padding:7px 9px;text-align:center;font-size:13px}input,select{width:100%;height:57px;border:1.5px solid #cfd2d6;border-radius:10px;margin-bottom:10px;padding:0 14px;font-size:17px;background:#fff}.save{width:100%;height:58px;border:0;border-radius:10px;background:#303034;color:#fff;font-weight:900;font-size:18px}.edit{display:none;background:#fff1b8;padding:9px;border-radius:8px;margin-bottom:9px}.edit.show{display:flex;justify-content:space-between}.edit button{border:0;background:none;font-weight:900}.filters{display:flex;gap:10px;overflow:auto;margin-bottom:12px}.f{min-width:130px;border:0;border-radius:999px;padding:14px;background:#e1e4e8;font-weight:800}.f.on{background:#1385f4;color:#fff}.list{padding:0;overflow:hidden}.head,.row{display:grid;grid-template-columns:67px 1fr 84px 40px;gap:6px;align-items:center;padding:13px 9px}.head{background:#f4f5f6;border-bottom:1px solid #ddd;font-size:13px;font-weight:800}.row{min-height:76px;border-bottom:1px solid #ddd}.date{font-size:12px}.desc{font-size:15px;word-break:break-word}.note{font-size:12px;color:#777;margin-top:3px}.amt{text-align:right;font-weight:900;font-size:14px}.amt.in{color:#25ae46}.amt.out{color:#d83d50}.del{width:36px;height:36px;border:0;border-radius:8px;background:#ff5258;color:#fff;font-weight:900}.empty{text-align:center;color:#777;padding:24px}.foot button{border:0;border-radius:10px;padding:14px 7px;font-weight:800}.backup{background:#dfe8ff;color:#125fca}.danger{background:#ffe1e4;color:#b42237}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.sheet{width:min(100%,470px);max-height:80vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.log{padding:9px 0;border-bottom:1px solid #eee}.time{font-size:12px;color:#888}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 13px;border-radius:9px;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><div class="top"><span>Giữ tiền cho toiiii</span><span class="av">😼</span></div><main class="w"><section class="c"><h1>Thu chi vô tri</h1><div class="ac">Tài khoản: huychau110@gmail.com</div><div class="acts"><button id="histB" class="b cy">Lịch sử thao tác</button><button id="backB" class="b dk">Sao lưu dữ liệu</button></div><div class="sum gr"><b>Tổng Thu:</b><strong id="inc">0 đ</strong></div><div class="sum rd"><b>Tổng Chi:</b><strong id="exp">0 đ</strong></div><div class="sum bl"><b>Số Dư:</b><strong id="bal">0 đ</strong></div><div class="legend"><span><i class="dot" style="background:#25ae46"></i>Tổng Thu</span><span><i class="dot" style="background:#e43448"></i>Tổng Chi</span></div><div class="pw"><div id="pie" class="pie"><div id="pt" class="pt">Chưa có dữ liệu</div></div></div></section><section class="c"><div id="eb" class="edit">Đang sửa giao dịch <button id="cancel">Hủy</button></div><input id="date" type="date"><input id="desc" placeholder="Mô tả (Ăn sáng, Lương...)"><input id="amount" inputmode="numeric" placeholder="Số tiền (VNĐ)"><select id="type"><option value="Chi">Khoản Chi</option><option value="Thu">Khoản Thu</option></select><input id="note" placeholder="Ghi chú thêm..."><button id="save" class="save">Thêm Giao Dịch</button></section><div class="filters"><button class="f on" data-f="all">Tất cả</button><button class="f" data-f="Thu">Chỉ xem Thu</button><button class="f" data-f="Chi">Chỉ xem Chi</button></div><section class="c list"><div class="head"><span>Ngày</span><span>Mô tả</span><span style="text-align:right">Số tiền</span><span>Xóa</span></div><div id="list"></div></section><div class="foot"><button id="restore" class="backup">Khôi phục JSON</button><button id="clear" class="danger">Xóa tất cả</button><input id="file" type="file" accept=".json,application/json" hidden></div></main><div id="modal" class="modal"><div class="sheet"><h2>Lịch sử thao tác</h2><div id="history"></div><button id="close" class="b dk" style="width:100%;margin-top:12px">Đóng</button></div></div><div id="toast" class="toast"></div><script>
const $=x=>document.getElementById(x),K='gt_tx_v1',LK='gt_log_v1';let tx=R(K,[]),logs=R(LK,[]),filter='all',editing=null;function R(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function P(){localStorage.setItem(K,JSON.stringify(tx));localStorage.setItem(LK,JSON.stringify(logs))}function td(){let d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,10)}function M(n){return new Intl.NumberFormat('vi-VN').format(+n||0)+' đ'}function N(v){return Number(String(v||'').replace(/\D/g,''))}function E(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function D(v){let p=String(v).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v}function T(s){let e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(T.t);T.t=setTimeout(()=>e.classList.remove('show'),1500)}function L(s){logs.unshift({time:new Date().toLocaleString('vi-VN'),text:s});logs=logs.slice(0,100)}function totals(){return tx.reduce((a,t)=>{t.type==='Thu'?a.i+=+t.amount:a.e+=+t.amount;return a},{i:0,e:0})}function RS(){let t=totals(),all=t.i+t.e,p=all?t.i/all*100:50;$('inc').textContent=M(t.i);$('exp').textContent=M(t.e);$('bal').textContent=M(t.i-t.e);$('pie').style.background='conic-gradient(#25ae46 0 '+p+'%,#e43448 '+p+'% 100%)';$('pt').innerHTML=all?'Thu '+Math.round(p)+'%<br><b>'+M(t.i-t.e)+'</b>':'Chưa có dữ liệu'}function RL(){let a=[...tx].sort((x,y)=>(y.created||y.id)-(x.created||x.id));if(filter!=='all')a=a.filter(x=>x.type===filter);$('list').innerHTML=a.length?a.map(t=>'<div class="row" data-id="'+t.id+'"><div class="date">'+D(t.date)+'</div><div class="desc">'+E(t.desc)+(t.note?'<div class="note">'+E(t.note)+'</div>':'')+'</div><div class="amt '+(t.type==='Thu'?'in':'out')+'">'+(t.type==='Thu'?'+':'-')+new Intl.NumberFormat('vi-VN').format(t.amount)+'</div><button class="del" data-del="'+t.id+'">X</button></div>').join(''):'<div class="empty">Chưa có giao dịch nào.</div>'}function RH(){$('history').innerHTML=logs.length?logs.map(x=>'<div class="log"><div class="time">'+E(x.time)+'</div>'+E(x.text)+'</div>').join(''):'<div class="empty">Chưa có lịch sử.</div>'}function render(){RS();RL();RH()}function reset(){editing=null;$('date').value=td();$('desc').value='';$('amount').value='';$('type').value='Chi';$('note').value='';$('save').textContent='Thêm Giao Dịch';$('eb').classList.remove('show')}function edit(id){let t=tx.find(x=>String(x.id)===String(id));if(!t)return;editing=t.id;$('date').value=t.date;$('desc').value=t.desc;$('amount').value=new Intl.NumberFormat('vi-VN').format(t.amount);$('type').value=t.type;$('note').value=t.note||'';$('save').textContent='Cập Nhật Giao Dịch';$('eb').classList.add('show')}
$('amount').oninput=e=>{let n=N(e.target.value);e.target.value=n?new Intl.NumberFormat('vi-VN').format(n):''};$('save').onclick=()=>{let date=$('date').value,desc=$('desc').value.trim(),amount=N($('amount').value),type=$('type').value,note=$('note').value.trim();if(!date||!desc||!amount)return T('Nhập đủ ngày, mô tả và số tiền');if(editing!==null){let t=tx.find(x=>String(x.id)===String(editing));Object.assign(t,{date,desc,amount,type,note});L('Cập nhật: '+desc)}else{tx.push({id:Date.now(),date,desc,amount,type,note,created:Date.now()});L('Thêm: '+desc)}P();reset();render();T('Đã lưu')};$('list').onclick=e=>{let d=e.target.closest('[data-del]');if(d){e.stopPropagation();let t=tx.find(x=>String(x.id)===d.dataset.del);if(t&&confirm('Xóa “'+t.desc+'”?')){tx=tx.filter(x=>String(x.id)!==d.dataset.del);L('Xóa: '+t.desc);P();render()}return}let r=e.target.closest('.row');if(r)edit(r.dataset.id)};document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;RL()});$('cancel').onclick=reset;$('histB').onclick=()=>{$('modal').classList.add('show');RH()};$('close').onclick=()=>$('modal').classList.remove('show');$('clear').onclick=()=>{if(tx.length&&confirm('Xóa toàn bộ giao dịch?')){tx=[];L('Xóa toàn bộ giao dịch');P();reset();render()}};$('backB').onclick=()=>{let data=JSON.stringify({version:1,transactions:tx,logs},null,2),name='giu-tien-backup-'+td()+'.json';if(window.Android&&Android.saveBackup)Android.saveBackup(data,name)};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files&&e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.transactions))throw 0;if(confirm('Khôi phục '+d.transactions.length+' giao dịch?')){tx=d.transactions;logs=Array.isArray(d.logs)?d.logs:[];L('Khôi phục '+tx.length+' giao dịch');P();reset();render();T('Đã khôi phục')}}catch{alert('File sao lưu không hợp lệ')}e.target.value=''};reset();render();
</script></body></html>
